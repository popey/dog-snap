name: dog
base: core24
version: 0.1.0
summary: dog
description: |
  dog is a command-line DNS client.

grade: stable
confinement: strict

parts:
  dog:
    plugin: rust
    source: https://github.com/ogham/dog/archive/refs/tags/v$CRAFT_PROJECT_VERSION.tar.gz
    override-build: |
      # The release lockfile predates OpenSSL 3, provided by core24.
      cargo update -p openssl --precise 0.10.81
      cargo update -p openssl-sys --precise 0.9.117
      craftctl default
    build-packages:
      - libssl-dev
      - build-essential
      - pkg-config

apps:
  dog:
    command: bin/dog
    plugs:
      - network
